spring.application.name=futures-tracker-backend

# --- H2 in-memory database ---
# Swap these 4 lines for Postgres later (same JPA code, zero service/controller changes):
#   spring.datasource.url=jdbc:postgresql://localhost:5432/futurestracker
#   spring.datasource.driver-class-name=org.postgresql.Driver
#   spring.jpa.hibernate.ddl-auto=validate   (use Flyway/Liquibase in real Postgres setup)
spring.datasource.url=jdbc:h2:mem:futurestracker;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at /h2-console (demo/dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI at /swagger-ui.html, raw spec at /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# File upload size limits (Excel import)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080
